name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast test: scaffolds all 12 combinations and verifies generated files.
  # It does not run dependency installs inside generated projects.
  render-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run test:render-matrix

  # Deep test: installs a generated JavaScript project and verifies it serves traffic.
  boot-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      
      - name: Scaffold JS Project
        run: |
          node -e "
            import { scaffoldProject } from './src/scaffold.js';
            const context = {
              projectName: 'test-project', language: 'javascript',
              database: 'postgresql', orm: 'sequelize', authStrategy: 'session',
              features: { auth: false, database: false, csrf: false, audit: false, oauth: false, email: false, fileUpload: false, docker: false, testing: false, githubActions: false }
            };
            await scaffoldProject('./test-project', context);
          "
      
      - name: Install & Boot
        working-directory: test-project
        run: |
          npm install --no-audit --no-fund
          cp .env.example .env
          PORT=3001 npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/heartbeat; then
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          cat server.log
          exit 1

  boot-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      
      - name: Scaffold TS Project
        run: |
          node -e "
            import { scaffoldProject } from './src/scaffold.js';
            const context = {
              projectName: 'test-project', language: 'typescript',
              database: 'postgresql', orm: 'sequelize', authStrategy: 'session',
              features: { auth: false, database: false, csrf: false, audit: false, oauth: false, email: false, fileUpload: false, docker: false, testing: false, githubActions: false }
            };
            await scaffoldProject('./test-project', context);
          "
      
      - name: Install, Typecheck & Boot
        working-directory: test-project
        run: |
          npm install --no-audit --no-fund
          cp .env.example .env
          npm run typecheck
          PORT=3002 npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3002/api/v1/heartbeat; then
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          cat server.log
          exit 1
